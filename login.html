<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#C8102E">
  <title>Admin login · Shaon's Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>try{var t=localStorage.getItem('sj-theme');if(t)document.documentElement.dataset.theme=t;var p=JSON.parse(localStorage.getItem('sj-prefs')||'{}');if(p.accent)document.documentElement.style.setProperty('--accent-custom',p.accent);}catch(e){}</script>
</head>
<body class="login-page">
  <main class="login-box">
    <a class="brand" href="/"><span class="mark">§</span>Shaon's Journal</a>
    <h1>Admin login</h1>
    <p class="muted">Sign in to write and manage articles.</p>
    <div id="login-form">
      <label>Username <input id="username" type="text" autocomplete="username" autofocus></label>
      <label>Password <input id="password" type="password" autocomplete="current-password"></label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-btn" class="btn primary" type="button">Sign in</button>
    </div>
    <a class="muted back-link" href="/">← Back to the journal</a>
  </main>
  <script>
    const err = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');
    async function login() {
      err.hidden = true;
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (!res.ok) {
          const j = await res.json().catch(() => ({}));
          throw new Error(j.detail || 'Sign in failed');
        }
        location.href = '/#/admin';
      } catch (e) {
        err.textContent = e.message;
        err.hidden = false;
        btn.disabled = false;
      }
    }
    btn.addEventListener('click', login);
    document.getElementById('login-form').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
