<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3C204C">
  <title>Shaon's Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>try{var t=localStorage.getItem('sj-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <div id="progress" class="progress"></div>
  <header class="topbar">
    <a class="brand" href="#/"><span class="mark">§</span>Shaon's Journal</a>
    <div class="top-actions">
      <nav id="nav"></nav>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle light and dark theme">◐</button>
      <button id="menu-btn" class="icon-btn" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
      <a class="avatar" href="#site-footer" title="Shaon Khan"><img src="shaon.png" alt="Md. Shaon Khan" width="44" height="44"></a>
    </div>
  </header>

  <main class="container">
    <section id="view-home">
      <div class="hero">
        <h1>Shaon's Journal</h1>
        <p>Shaon’s Writings - On artificial intelligence, robotics, economics, and contemporary public affairs.</p>
        <label class="search"><span>⌕</span><input id="q" type="search" placeholder="Search articles" aria-label="Search articles" autocomplete="off"></label>
      </div>
      <div id="home-cats" class="chips"></div>
      <div id="home-list" class="grid"></div>
    </section>

    <section id="view-article" hidden>
      <a class="muted" href="#/">← All articles</a>
      <article id="article-body"></article>
    </section>

    <section id="view-dashboard" hidden>
      <div class="row">
        <h1>Dashboard</h1>
        <a class="btn primary" href="#/new">New article</a>
      </div>
      <div id="dash-stats" class="stats"></div>
      <div id="dash-list"></div>
    </section>

    <section id="view-editor" hidden>
      <div class="row editor-bar">
        <div class="row">
          <span id="ed-badge" class="badge">Draft</span>
          <span id="ed-status" class="muted">Not saved yet</span>
        </div>
        <div class="row">
          <a id="ed-view" class="btn" href="#/" hidden>View article</a>
          <button id="btn-draft" class="btn" type="button">Save draft</button>
          <button id="btn-publish" class="btn primary" type="button">Publish</button>
        </div>
      </div>
      <input id="ed-title" class="title-input" type="text" placeholder="Article title" maxlength="200">
      <div class="row meta-row">
        <input id="ed-category" type="text" placeholder="Category (e.g. Python)" maxlength="60">
        <input id="ed-summary" type="text" placeholder="One-line summary" maxlength="500">
      </div>
      <div id="add-bar" class="add-bar"></div>
      <div id="editor-blocks"></div>
    </section>
  </main>

  <footer id="site-footer" class="footer">
    <div class="footer-in">
      <div class="footer-brand">
        <strong>Shaon's Journal</strong>
        <span class="muted">© <span id="yr"></span> Md. Shaon Khan</span>
      </div>
      <nav class="footer-links" aria-label="Contact and social links">
        <a href="https://github.com/Md-Shaon-Khan/Md-Shaon-Khan/" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://www.linkedin.com/in/md-shaon-khan-01003433a/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://www.facebook.com/sa.ona.khana.803112" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a href="mailto:shaon.iit52@gmail.com">shaon.iit52@gmail.com</a>
      </nav>
    </div>
  </footer>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>

  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
